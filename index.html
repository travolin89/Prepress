<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prepress">
<meta name="theme-color" content="#1c1c1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Prepress</title>
<style>
  :root {
    --bg: #1c1c1f; --panel: #26262b; --panel2: #2f2f35; --line: #3a3a42; --text: #ececf1; --dim: #9a9aa6;
    --accent: #3d8bfd; --ok: #2fb36b; --warn: #e5a50a; --bad: #e5484d; --stage: #46464c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100%;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header::-webkit-scrollbar { display: none; }
  button, select, .btn { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; min-height: 40px; padding: 0 14px; white-space: nowrap; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.on { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .4; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; flex: none; }
  .pageinfo { min-width: 64px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  .title { font-weight: 600; margin-right: 6px; flex: none; }
  .dot { display: none; width: 8px; height: 8px; border-radius: 4px; background: var(--warn); margin-left: 6px; }
  .dirty .dot { display: inline-block; }
  main { position: relative; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; overflow: hidden; background: var(--stage); touch-action: none; }
  #sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 4px 24px rgba(0,0,0,.45); }
  #sheet canvas { display: block; image-rendering: auto; }
  #sheet svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  #cross { position: absolute; width: 0; height: 0; pointer-events: none; display: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #ff2d55; }
  #cross::before { left: -18px; top: -0.5px; width: 36px; height: 1px; }
  #cross::after { top: -18px; left: -0.5px; height: 36px; width: 1px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); padding: 24px; }
  #empty h1 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
  aside { width: 350px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  aside.hidden { display: none; }
  @media (max-width: 900px) { aside { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.4); } }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 2px 8px; }
  aside h2:first-child { margin-top: 2px; }
  .ink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); margin-bottom: 6px; }
  .ink .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); flex: none; }
  .ink .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ink input { width: 22px; height: 22px; accent-color: var(--accent); }
  .hint { color: var(--dim); font-size: 13px; margin: 4px 2px 8px; }
  .report { font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word;
    background: var(--panel2); border-radius: 10px; padding: 10px; color: #d6d6de; -webkit-user-select: text; user-select: text; }
  .boxrow { display: grid; grid-template-columns: 56px repeat(4, 1fr); gap: 4px; align-items: center; margin-bottom: 4px; font-size: 13px; }
  .boxrow input { width: 100%; min-height: 36px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 0 4px; font-size: 13px; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
  .boxrow .lbl { display: flex; align-items: center; gap: 6px; }
  .boxrow .lbl i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .boxhead { color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .row input { width: 70px; min-height: 40px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; }
  footer { display: flex; align-items: center; gap: 14px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border-top: 1px solid var(--line); font-size: 13.5px; font-variant-numeric: tabular-nums;
    min-height: 40px; overflow-x: auto; white-space: nowrap; }
  footer .k { color: var(--dim); }
  #busy { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.35); z-index: 20; }
  #busy div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; display: flex; gap: 12px; align-items: center; }
  #busy .spin { width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 18px; max-width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 10px; }
  dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .good { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  ul.diffs { max-height: 40vh; overflow: auto; font: 12.5px/1.45 ui-monospace, Menlo, monospace; padding-left: 18px; margin: 8px 0 0; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<header>
  <span class="title">Prepress</span>
  <label class="btn" style="display:flex;align-items:center">Open<input id="file" type="file" accept=".pdf,application/pdf" hidden></label>
  <button id="save" disabled>Save<span class="dot"></span></button>
  <span class="sep"></span>
  <button id="prev" disabled>◀</button><span class="pageinfo" id="pageinfo">–</span><button id="next" disabled>▶</button>
  <span class="sep"></span>
  <button id="fit" disabled>Fit</button>
  <button id="seps" disabled title="True separations (Ghostscript)">Separations</button>
  <button id="dens" disabled title="Drag to read ink values">Densitometer</button>
  <button id="boxesBtn" class="on" disabled>Boxes</button>
  <select id="dpi" disabled title="Preview resolution">
    <option value="72">72 dpi</option><option value="100">100 dpi</option><option value="150" selected>150 dpi</option>
    <option value="200">200 dpi</option><option value="300">300 dpi</option><option value="450">450 dpi</option>
  </select>
  <span class="sep"></span>
  <button id="panel" class="on">Inspector</button>
</header>
<main>
  <div id="stage">
    <div id="sheet"><canvas id="page" width="1" height="1"></canvas><svg id="boxes"></svg></div>
    <div id="cross"></div>
    <div id="empty"><div><h1>Prepress</h1>Open a PDF/X file to start.<br>Everything runs on this iPad; files never leave it.</div></div>
  </div>
  <aside id="aside">
    <h2>Inks</h2>
    <div id="inks"><div class="hint">No file open.</div></div>
    <h2>Page boxes (mm from media corner)</h2>
    <div id="boxedit"><div class="hint">No file open.</div></div>
    <h2>Document</h2>
    <div class="report" id="report">–</div>
  </aside>
</main>
<footer id="readout"><span class="k">Ready</span></footer>
<div id="busy"><div><span class="spin"></span><span id="busymsg">Working…</span></div></div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><div class="acts" id="dlgActs"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
